name: Publish student page

on:
    workflow_dispatch:
        inputs:
            api_url:
                description: HTTPS Vercel backend origin (overrides STUDENT_API_URL repository variable)
                required: false
                type: string

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: student-pages
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - uses: actions/configure-pages@v5
            - run: npm ci
              working-directory: frontend
            - run: npm run build:student
              working-directory: frontend
              env:
                  VITE_STUDENT_API_URL: ${{ inputs.api_url || vars.STUDENT_API_URL }}
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: frontend/dist-student
            - id: deployment
              uses: actions/deploy-pages@v4
